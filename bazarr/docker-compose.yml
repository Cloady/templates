services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.2
    environment:
      TZ: ${TZ}
      PGID: "1000"
      PUID: "1000"
    ports:
      - 6767
    volumes:
      - data:/config
      - media:/media
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
  media:
    driver_opts:
      size: 2Gi
