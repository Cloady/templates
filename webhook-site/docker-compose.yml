services:
  redis:
    image: redis:alpine
    expose:
      - 6379
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 128M
  webhook:
    image: webhooksite/webhook.site
    command: php artisan queue:work --daemon --tries=3 --timeout=10
    environment:
      APP_ENV: dev
      APP_LOG: errorlog
      APP_URL: http://localhost:8084
      APP_DEBUG: "true"
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
      DB_CONNECTION: sqlite
      ECHO_HOST_MODE: path
      BROADCAST_DRIVER: redis
    ports:
      - 80
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
  laravel-echo-server:
    image: webhooksite/laravel-echo-server
    expose:
      - 6001
    environment:
      ECHO_PROTOCOL: http
      ECHO_ALLOW_CORS: "true"
      ECHO_REDIS_PORT: "6379"
      ECHO_ALLOW_ORIGIN: "*"
      ECHO_ALLOW_HEADERS: "*"
      ECHO_ALLOW_METHODS: "*"
      ECHO_REDIS_HOSTNAME: redis
      LARAVEL_ECHO_SERVER_HOST: 0.0.0.0
      LARAVEL_ECHO_SERVER_PORT: "6001"
      LARAVEL_ECHO_SERVER_AUTH_HOST: http://webhook
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 256M
