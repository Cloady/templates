services:
  db:
    image: postgres:18-alpine
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: bitwarden_vault
      POSTGRES_USER: bitwarden
      POSTGRES_PASSWORD: super_strong_password
    volumes:
      - psql:/var/lib/postgresql/data
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
  bitwarden:
    image: ghcr.io/bitwarden/lite
    ports:
      - 8080
    volumes:
      - data:/etc/bitwarden
      - logs:/var/log/bitwarden
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
  logs:
    driver_opts:
      size: 2Gi
  psql:
    driver_opts:
      size: 2Gi
