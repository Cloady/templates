services:
  gitlab:
    image: gitlab/gitlab-ce:19.4.1-ce.0
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD}
      GITLAB_OMNIBUS_CONFIG: external_url '${PUBLIC_URL}'; nginx['listen_port'] = 80; nginx['listen_https'] = false; letsencrypt['enable'] = false; gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']; puma['worker_processes'] = 0; sidekiq['concurrency'] = 10; prometheus_monitoring['enable'] = false; gitlab_kas['enable'] = false; gitlab_rails['env'] = { 'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000' }; gitaly['env'] = { 'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000', 'GITALY_COMMAND_SPAWN_MAX_PARALLEL' => '2' }
    ports:
      - 80
    volumes:
      - config:/etc/gitlab
      - data:/var/opt/gitlab
      - logs:/var/log/gitlab
    deploy:
      resources:
        reservations:
          cpus: 1
          memory: 4G
volumes:
  data:
    driver_opts:
      size: 20Gi
  logs:
    driver_opts:
      size: 2Gi
  config:
    driver_opts:
      size: 1Gi
