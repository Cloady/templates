services:
  haven:
    image: ghcr.io/havenweb/haven:latest
    environment:
      RAILS_ENV: production
      HAVEN_DB_HOST: haven-db
      HAVEN_DB_NAME: haven
      HAVEN_DB_ROLE: haven
      HAVEN_USER_PASS: ${HAVEN_USER_PASSWORD}
      HAVEN_USER_EMAIL: ${HAVEN_USER_EMAIL}
      HAVEN_DB_PASSWORD: ${HAVEN_DB_PASSWORD}
    ports:
      - 3000
    volumes:
      - storage:/storage
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
  haven-db:
    image: postgres:13.23-alpine
    expose:
      - 5432
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - synchronous_commit=off
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - wal_level=logical
    environment:
      POSTGRES_USER: haven
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db:/var/lib/postgresql/data
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
volumes:
  db:
    driver_opts:
      size: 2Gi
  storage:
    driver_opts:
      size: 2Gi
