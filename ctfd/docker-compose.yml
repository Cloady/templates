services:
  ctfd:
    image: ctfd/ctfd:3.8.8
    environment:
      WORKERS: "1"
      ERROR_LOG: "-"
      REDIS_URL: redis://ctfd-redis:6379
      ACCESS_LOG: "-"
      LOG_FOLDER: /var/log/CTFd
      SECRET_KEY: ${CTFD_SECRET_KEY}
      DATABASE_URL: mysql+pymysql://tipi:${CTFD_MYSQL_DB_PASSWORD}@ctfd-db/ctfd
      REVERSE_PROXY: "true"
      UPLOAD_FOLDER: /var/uploads
    ports:
      - 8000
    volumes:
      - uploads:/var/log/CTFd
      - uploads:/var/uploads
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
  ctfd-db:
    image: mariadb:10.11.19
    expose:
      - 3306
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --wait_timeout=28800
      - --log-warnings=0
    environment:
      MYSQL_USER: tipi
      MYSQL_DATABASE: ctfd
      MYSQL_PASSWORD: ${CTFD_MYSQL_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CTFD_MYSQL_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
  ctfd-redis:
    image: redis:4
    expose:
      - 6379
    volumes:
      - redis:/data
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 128M
volumes:
  db:
    driver_opts:
      size: 2Gi
  redis:
    driver_opts:
      size: 2Gi
  uploads:
    driver_opts:
      size: 2Gi
