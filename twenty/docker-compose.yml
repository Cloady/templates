services:
  server:
    image: twentycrm/twenty:v2.45.4
    environment:
      NODE_PORT: "3000"
      PG_DATABASE_URL: postgres://postgres:${PG_DATABASE_PASSWORD}@db:5432/default
      SERVER_URL: ${PUBLIC_URL}
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: local
      APP_SECRET: ${APP_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ports:
      - 3000
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          cpus: 0.5
          memory: 1G
  worker:
    image: twentycrm/twenty:v2.45.4
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://postgres:${PG_DATABASE_PASSWORD}@db:5432/default
      SERVER_URL: ${PUBLIC_URL}
      REDIS_URL: redis://redis:6379
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      STORAGE_TYPE: local
      APP_SECRET: ${APP_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 1G
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
    expose:
      - 5432
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
  redis:
    image: redis:8.10.2
    command: ["--maxmemory-policy", "noeviction"]
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 128M
volumes:
  server-local-data:
    driver_opts:
      size: 2Gi
  db-data:
    driver_opts:
      size: 2Gi
