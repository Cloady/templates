services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.27.1-rootless
    environment:
      HBOX_LOG_LEVEL: info
      HBOX_LOG_FORMAT: text
      HBOX_AUTH_API_KEY_PEPPER: ${HBOX_AUTH_API_KEY_PEPPER}
      HBOX_WEB_MAX_UPLOAD_SIZE: "10"
      HBOX_OPTIONS_ALLOW_REGISTRATION: ${HBOX_OPTIONS_ALLOW_REGISTRATION}
    ports:
      - 7745
    volumes:
      - homebox-data:/data/
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  homebox-data:
    driver_opts:
      size: 2Gi
