services:
  tomcat:
    image: tomcat:11.0.26-jdk21
    environment:
      CATALINA_OPTS: ${CATALINA_OPTS}
    ports:
      - 8080
    volumes:
      - webapps:/usr/local/tomcat/webapps
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
volumes:
  webapps:
    driver_opts:
      size: 1Gi
