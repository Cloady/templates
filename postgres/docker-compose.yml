services:
  postgres:
    image: postgres:18.6
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_TLS: ${POSTGRES_TLS}
    configs:
      - source: 00-tls.sh
        target: /docker-entrypoint-initdb.d/00-tls.sh
    ports:
      - 5432
    volumes:
      - data:/var/lib/postgresql/data
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
configs:
  00-tls.sh:
    file: ./configs/00-tls.sh
