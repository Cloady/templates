services:
  mealie-api:
    image: hkotel/mealie:api-v1.0.0beta-5
    expose:
      - 9000
    environment:
      TZ: Europe/Berlin
      PGID: "1000"
      PUID: "1000"
      BASE_URL: https://mealie.example.com
      MAX_WORKERS: "1"
      ALLOW_SIGNUP: "true"
      WEB_CONCURRENCY: "1"
    volumes:
      - data:/app/data/
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 256M
  mealie-frontend:
    image: hkotel/mealie:frontend-v1.0.0beta-5
    environment:
      API_URL: http://mealie-api:9000
    ports:
      - 3000
    volumes:
      - data:/app/data/
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
