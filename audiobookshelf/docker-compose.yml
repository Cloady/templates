services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.1
    ports:
      - 80
    volumes:
      - spoken:/audiobooks
      - podcasts:/podcasts
      - config:/config
      - metadata:/metadata
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  config:
    driver_opts:
      size: 256Mi
  spoken:
    driver_opts:
      size: 1.5Gi
  metadata:
    driver_opts:
      size: 1.5Gi
  podcasts:
    driver_opts:
      size: 1.5Gi
