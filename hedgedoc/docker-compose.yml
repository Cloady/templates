services:
  hedgedoc:
    image: quay.io/hedgedoc/hedgedoc:1.12.0
    environment:
      CMD_DB_URL: postgres://hedgedoc:${HEDGEDOC_DB_PASSWORD}@hedgedoc-db:5432/hedgedoc
      CMD_DOMAIN: ${PUBLIC_HOST}
      CMD_URL_ADDPORT: ${HEDGEDOC_ADDPORT}
    ports:
      - 3000
    volumes:
      - hedgedoc-uploads:/hedgedoc/public/uploads
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
  hedgedoc-db:
    image: postgres:13.23-alpine
    environment:
      POSTGRES_DB: hedgedoc
      POSTGRES_USER: hedgedoc
      POSTGRES_PASSWORD: ${HEDGEDOC_DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
volumes:
  postgres:
    driver_opts:
      size: 2Gi
  hedgedoc-uploads:
    driver_opts:
      size: 2Gi
