services:
  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:8.8.1
    environment:
      ROOT_URL: ${PUBLIC_URL}
      PORT: "3000"
      DEPLOY_METHOD: docker
      DEPLOY_PLATFORM: compose
      MONGO_URL: mongodb://mongodb:27017/rocketchat?replicaSet=rs0
      TRANSPORTER: monolith+nats://nats:4222
    ports:
      - 3000
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      nats:
        condition: service_started
    deploy:
      resources:
        reservations:
          cpus: 0.5
          memory: 1G
  mongodb:
    image: mongodb/mongodb-community-server:8.0.32-ubi8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    expose:
      - 27017
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
  nats:
    image: nats:2.15.0-alpine
    command: ["--http_port", "8222"]
    expose:
      - 4222
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 64M
volumes:
  uploads:
    driver_opts:
      size: 2Gi
  mongodb:
    driver_opts:
      size: 2Gi
