services:
  mstream:
    image: lscr.io/linuxserver/mstream:v6.31.1-ls33
    environment:
      TZ: ${TZ}
      PGID: "1000"
      PUID: "1000"
    ports:
      - 3000
    volumes:
      - mstream-config:/data
      - music:/music
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  music:
    driver_opts:
      size: 2Gi
  mstream-config:
    driver_opts:
      size: 2Gi
