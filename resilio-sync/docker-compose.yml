services:
  resilio-sync:
    image: lscr.io/linuxserver/resilio-sync:3.1.2
    environment:
      PGID: "1000"
      PUID: "1000"
    ports:
      - 8888
      - 55555
    volumes:
      - config:/config
      - downloads:/downloads
      - sync:/sync
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  sync:
    driver_opts:
      size: 2Gi
  config:
    driver_opts:
      size: 256Mi
  downloads:
    driver_opts:
      size: 2Gi
