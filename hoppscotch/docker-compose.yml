services:
  hoppscotch:
    image: hoppscotch/hoppscotch:2026.9.0
    command:
      - sh
      - -c
      - pnpm exec prisma migrate deploy && exec node /usr/src/app/aio_run.mjs
    environment:
      DATABASE_URL: postgresql://hoppscotch:${POSTGRES_PASSWORD}@hoppscotch-db:5432/hoppscotch
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      WHITELISTED_ORIGINS: ${PUBLIC_URL},${PUBLIC_URL}/admin
      ENABLE_SUBPATH_BASED_ACCESS: "true"
      VITE_BASE_URL: ${PUBLIC_URL}
      VITE_SHORTCODE_BASE_URL: ${PUBLIC_URL}
      VITE_ADMIN_URL: ${PUBLIC_URL}/admin
      VITE_BACKEND_GQL_URL: ${PUBLIC_URL}/backend/graphql
      VITE_BACKEND_WS_URL: wss://${PUBLIC_HOST}/backend/graphql
      VITE_BACKEND_API_URL: ${PUBLIC_URL}/backend/v1
    ports:
      - 80
    depends_on:
      hoppscotch-db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
  hoppscotch-db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: hoppscotch
      POSTGRES_USER: hoppscotch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - 5432
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -h
        - 127.0.0.1
        - -U
        - hoppscotch
        - -d
        - hoppscotch
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  db:
    driver_opts:
      size: 1Gi
