services:
  directus:
    image: directus/directus:12.4.1
    environment:
      SECRET: ${SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - 8055
    volumes:
      - uploads:/directus/uploads
      - extensions:/directus/extensions
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - 5432
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "directus", "-d", "directus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  uploads:
    driver_opts:
      size: 2Gi
  extensions:
    driver_opts:
      size: 512Mi
  db:
    driver_opts:
      size: 1Gi
