services:
  drupal:
    image: drupal:11.4.8-php8.5-apache
    configs:
      - source: reverse-proxy.conf
        target: /etc/apache2/conf-enabled/reverse-proxy.conf
    ports:
      - 80
    volumes:
      - modules:/var/www/html/modules
      - profiles:/var/www/html/profiles
      - themes:/var/www/html/themes
      - sites:/var/www/html/sites
    depends_on:
      - postgres
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: drupal
      POSTGRES_USER: drupal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - 5432
    volumes:
      - db:/var/lib/postgresql
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  modules:
    driver_opts:
      size: 512Mi
  profiles:
    driver_opts:
      size: 256Mi
  themes:
    driver_opts:
      size: 256Mi
  sites:
    driver_opts:
      size: 2Gi
  db:
    driver_opts:
      size: 1Gi
configs:
  reverse-proxy.conf:
    file: ./configs/reverse-proxy.conf
