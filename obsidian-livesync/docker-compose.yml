services:
  obsidian-livesync:
    image: couchdb:3.5.2
    environment:
      COUCHDB_USER: ${OBSIDIAN_LIVESYNC_USER}
      COUCHDB_PASSWORD: ${OBSIDIAN_LIVESYNC_PASSWORD}
    ports:
      - 5984
    volumes:
      - couchdb:/opt/couchdb/data
      - config:/opt/couchdb/etc/local.d
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  couchdb:
    driver_opts:
      size: 2Gi
  config:
    driver_opts:
      size: 256Mi
