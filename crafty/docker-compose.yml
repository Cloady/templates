services:
  crafty:
    image: registry.gitlab.com/crafty-controller/crafty-4:4.11.0
    environment:
      TZ: ${TZ}
    ports:
      - target: 8443
        app_protocol: https
      - 8123
      - 19132/udp
      - 25565/tcp
      - 25566/tcp
      - 25567/tcp
      - 25568/tcp
      - 25569/tcp
    volumes:
      - backups:/crafty/backups
      - logs:/crafty/logs
      - servers:/crafty/servers
      - config:/crafty/app/config
      - import:/crafty/import
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  logs:
    driver_opts:
      size: 256Mi
  config:
    driver_opts:
      size: 256Mi
  import:
    driver_opts:
      size: 1.5Gi
  backups:
    driver_opts:
      size: 1.5Gi
  servers:
    driver_opts:
      size: 1.5Gi
