services:
  redis:
    image: docker.io/library/redis:alpine
    expose:
      - 6379
    command: --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 128M
  worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.5}
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
    volumes:
      - certs:/certs
      - media:/media
      - custom-templates:/templates
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 256M
  postgresql:
    image: docker.io/library/postgres:16-alpine
    expose:
      - 5432
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
    volumes:
      - psql:/var/lib/postgresql/data
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
  authentik-proxy:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.5}
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
    ports:
      - 9000
      - 9443
    volumes:
      - media:/media
      - custom-templates:/templates
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  psql:
    driver_opts:
      size: 2Gi
  certs:
    driver_opts:
      size: 2Gi
  media:
    driver_opts:
      size: 2Gi
  redis-data:
    driver_opts:
      size: 2Gi
  custom-templates:
    driver_opts:
      size: 2Gi
