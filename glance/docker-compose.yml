services:
  glance:
    image: glanceapp/glance:v0.8.7
    entrypoint: >-
      sh -c '{ [ -f /app/config/glance.yml ] || cp /cloady/glance.yml /app/config/glance.yml; }
      && exec /app/glance --config /app/config/glance.yml'
    ports:
      - 8080
    configs:
      - source: glance
        target: /cloady/glance.yml
    volumes:
      - data:/app/config/
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
configs:
  glance:
    file: ./configs/glance.yml
volumes:
  data:
    driver_opts:
      size: 2Gi
