services:
  windmill-server:
    image: ghcr.io/windmill-labs/windmill:1.823.0
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/windmill?sslmode=disable
      MODE: server
      BASE_URL: ${PUBLIC_URL}
    ports:
      - 8000
    volumes:
      - worker-logs:/tmp/windmill/logs
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
  windmill-worker:
    image: ghcr.io/windmill-labs/windmill:1.823.0
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/windmill?sslmode=disable
      MODE: worker
      WORKER_GROUP: default
    volumes:
      - worker-cache:/tmp/windmill/cache
      - worker-logs:/tmp/windmill/logs
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          cpus: 0.5
          memory: 1G
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: windmill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - 5432
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "windmill"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
volumes:
  db:
    driver_opts:
      size: 2Gi
  worker-cache:
    driver_opts:
      size: 2Gi
  worker-logs:
    driver_opts:
      size: 1Gi
