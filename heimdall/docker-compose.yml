services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:2.8.3
    environment:
      TZ: ${TZ}
      PGID: "1000"
      PUID: "1000"
    ports:
      - 80
    volumes:
      - config:/config
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  config:
    driver_opts:
      size: 2Gi
