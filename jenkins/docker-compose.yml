services:
  jenkins:
    image: jenkins/jenkins:2.580.1-lts-jdk21
    ports:
      - 8080
    expose:
      - 50000
    volumes:
      - jenkins-home:/var/jenkins_home
    deploy:
      resources:
        reservations:
          cpus: 0.5
          memory: 1G
volumes:
  jenkins-home:
    driver_opts:
      size: 5Gi
