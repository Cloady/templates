services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3
    environment:
      TZ: ${TZ}
      PGID: "1000"
      PUID: "1000"
    ports:
      - 8080
    volumes:
      - config:/config
      - usenet:/media/usenet
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  config:
    driver_opts:
      size: 2Gi
  usenet:
    driver_opts:
      size: 2Gi
