services:
  php:
    image: php:8-fpm-alpine
    expose:
      - 9000
    volumes:
      - www-data:/var/www
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 256M
  web:
    image: nginx:stable-alpine
    ports:
      - 80
    volumes:
      - www-data:/var/www
      - nginx-conf:/etc/nginx/conf.d
      - logs:/var/log/nginx
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 128M
volumes:
  logs:
    driver_opts:
      size: 256Mi
  www-data:
    driver_opts:
      size: 2Gi
  nginx-conf:
    driver_opts:
      size: 256Mi
