services:
  metabase:
    image: metabase/metabase:v0.63.19
    environment:
      MGID: ${GID-1000}
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: ${TZ}
    ports:
      - 3000
    volumes:
      - data:/metabase-data
      - plugins:/plugins
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
  plugins:
    driver_opts:
      size: 2Gi
