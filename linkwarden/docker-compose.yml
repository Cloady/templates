services:
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.16.3
    environment:
      DATABASE_URL: postgresql://tipi:${LINKWARDEN_DB_PASSWORD}@linkwarden-db:5432/linkwarden
      NEXTAUTH_URL: ${APP_PROTOCOL}://${PUBLIC_HOST}/api/v1/auth
      NEXTAUTH_SECRET: ${LINKWARDEN_NEXTAUTH_SECRET}
      NEXT_PUBLIC_DISABLE_REGISTRATION: ${LINKWARDEN_NEXT_PUBLIC_DISABLE_REGISTRATION}
    ports:
      - 3000
    volumes:
      - linkwarden-data:/data/data
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
  linkwarden-db:
    image: postgres:16-alpine
    expose:
      - 5432
    environment:
      POSTGRES_DB: linkwarden
      POSTGRES_USER: tipi
      POSTGRES_PASSWORD: ${LINKWARDEN_DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
volumes:
  postgres:
    driver_opts:
      size: 2Gi
  linkwarden-data:
    driver_opts:
      size: 2Gi
