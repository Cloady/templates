services:
  app:
    image: docuseal/docuseal:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/docuseal
    ports:
      - 3000
    volumes:
      - data:/data
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
  postgres:
    image: postgres:18-alpine
    expose:
      - 5432
    environment:
      POSTGRES_DB: docuseal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg-data:/var/lib/postgresql
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
volumes:
  data:
    driver_opts:
      size: 2Gi
  pg-data:
    driver_opts:
      size: 2Gi
