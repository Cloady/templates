services:
  emby:
    image: lscr.io/linuxserver/emby:4.10.1
    environment:
      TZ: ${TZ}
      PGID: "1000"
      PUID: "1000"
    ports:
      - 8096
    volumes:
      - config:/config
      - data:/media/data
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
  config:
    driver_opts:
      size: 2Gi
