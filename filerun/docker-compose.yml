services:
  db:
    image: mariadb:11.8
    expose:
      - 3306
    environment:
      MYSQL_USER: your_filerun_username
      MYSQL_DATABASE: your_filerun_database
      MYSQL_PASSWORD: your_filerun_password
      MYSQL_ROOT_PASSWORD: your_mysql_root_password
    volumes:
      - db-mysql:/var/lib/mysql
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
  filerun:
    image: filerun/filerun:8.4
    environment:
      FR_DB_HOST: db
      FR_DB_NAME: your_filerun_database
      FR_DB_PASS: your_filerun_password
      FR_DB_PORT: "3306"
      FR_DB_USER: your_filerun_username
    ports:
      - 80
    volumes:
      - html:/var/www/html
      - files:/user-files
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  html:
    driver_opts:
      size: 512Mi
  files:
    driver_opts:
      size: 2Gi
  db-mysql:
    driver_opts:
      size: 1Gi
