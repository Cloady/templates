services:
  xfce:
    image: lscr.io/linuxserver/webtop:debian-xfce
    profiles: [xfce]
    environment: &env
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
      CUSTOM_USER: ${CUSTOM_USER:-admin}
      PASSWORD: ${PASSWORD:?PASSWORD is required}
      TITLE: Debian Desktop
    ports: &ports
      - 3000
    volumes: &volumes
      - config:/config
    deploy: &deploy
      resources:
        reservations:
          cpus: 2
          memory: 4G
  kde:
    image: lscr.io/linuxserver/webtop:debian-kde
    profiles: [kde]
    environment: *env
    ports: *ports
    volumes: *volumes
    deploy: *deploy
  mate:
    image: lscr.io/linuxserver/webtop:debian-mate
    profiles: [mate]
    environment: *env
    ports: *ports
    volumes: *volumes
    deploy: *deploy
  i3:
    image: lscr.io/linuxserver/webtop:debian-i3
    profiles: [i3]
    environment: *env
    ports: *ports
    volumes: *volumes
    deploy: *deploy
volumes:
  config:
    driver_opts:
      size: 20Gi
