services:
  invidious:
    image: quay.io/invidious/invidious:master
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: tipi
          password: tipi
          host: invidious-db
          port: 5432
        check_tables: true
        hmac_key: ${INVIDIOUS_HMAC_KEY}
        use_innertube_for_captions: true
        domain: ${INVIDIOUS_DOMAIN}
        external_port: ${INVIDIOUS_EXTERNAL_PORT}
        https_only: ${INVIDIOUS_HTTPS_ONLY}
        signature_server: inv_sig_helper:12999
        visitor_data: ${INVIDIOUS_VISITOR_DATA}
        po_token: ${INVIDIOUS_PO_TOKEN}
    ports:
      - 3000
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
  invidious-db:
    image: postgres:14
    expose:
      - 5432
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: tipi
      POSTGRES_PASSWORD: tipi
    volumes:
      - postgres:/var/lib/postgresql/data
      - sql:/config/sql
      - init-invidious-db-sh:/docker-entrypoint-initdb.d/init-invidious-db.sh
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
  inv-sig-helper:
    image: quay.io/invidious/inv-sig-helper:latest
    expose:
      - 12999
    command:
      - --tcp
      - 0.0.0.0:12999
    environment:
      RUST_LOG: info
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 256M
volumes:
  sql:
    driver_opts:
      size: 2Gi
  postgres:
    driver_opts:
      size: 2Gi
  init-invidious-db-sh:
    driver_opts:
      size: 2Gi
