services:
  app:
    image: l4rm4nd/requestbin:latest
    environment:
      REALM: prod
      REDIS_URL: //redis:6379
    ports:
      - 8000
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
  redis:
    image: redis:alpine
    expose:
      - 6379
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 128M
