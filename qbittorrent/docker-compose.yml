services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4
    environment:
      TZ: ${TZ}
      PGID: "1000"
      PUID: "1000"
      WEBUI_PORT: "80"
    ports:
      - 6881
    volumes:
      - config:/config
      - torrents:/media/torrents
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  config:
    driver_opts:
      size: 2Gi
  torrents:
    driver_opts:
      size: 2Gi
