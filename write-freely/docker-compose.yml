services:
  write-freely:
    image: nephatrine/write-freely:0.17
    environment:
      TZ: ${TZ}
      PGID: "1000"
      PUID: "1000"
    ports:
      - 8080
      - 70
    volumes:
      - config:/mnt/config
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  config:
    driver_opts:
      size: 2Gi
