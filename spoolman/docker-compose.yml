services:
  spoolman:
    image: ghcr.io/donkie/spoolman:0.27.0
    environment:
      TZ: ${TZ}
      PGID: "0"
      PUID: "0"
    ports:
      - 8000
    volumes:
      - data:/home/app/.local/share/spoolman
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
