services:
  siyuan:
    image: b3log/siyuan:v3.8.6
    command:
      - --workspace=/siyuan/workspace/
      - --accessAuthCode=${SIYUAN_ACCESS_AUTH_CODE}
    environment:
      TZ: ${TZ}
      PGID: "1000"
      PUID: "1000"
    ports:
      - 6806
    volumes:
      - workspace:/siyuan/workspace/
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  workspace:
    driver_opts:
      size: 2Gi
