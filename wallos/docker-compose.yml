services:
  wallos:
    image: bellamy/wallos:5.8.3
    environment:
      TZ: ${TZ}
    ports:
      - 80
    volumes:
      - db:/var/www/html/db
      - logos:/var/www/html/images/uploads/logos
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  db:
    driver_opts:
      size: 2Gi
  logos:
    driver_opts:
      size: 2Gi
