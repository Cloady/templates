services:
  2fauth:
    image: 2fauth/2fauth:8.0.2
    environment:
      APP_KEY: ${TWOFAUTH_APP_KEY}
      APP_URL: ${APP_PROTOCOL}://${PUBLIC_HOST}
      ASSET_URL: ${APP_PROTOCOL}://${PUBLIC_HOST}
    ports:
      - 8000
    volumes:
      - data:/2fauth
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
