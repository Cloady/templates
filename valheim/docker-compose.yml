services:
  valheim:
    image: ghcr.io/community-valheim-tools/valheim-server:sha-a134fb4
    environment:
      CROSSPLAY: ${CROSSPLAY}
      WORLD_NAME: ${WORLD_NAME}
      SERVER_NAME: ${SERVER_NAME}
      SERVER_PASS: ${SERVER_PASS}
      SERVER_PUBLIC: ${SERVER_PUBLIC}
    ports:
      - 2456/udp
      - 2457/udp
    volumes:
      - config:/config
      - serverfiles:/opt/valheim
    deploy:
      resources:
        reservations:
          cpus: 1
          memory: 4G
volumes:
  config:
    driver_opts:
      size: 5Gi
  serverfiles:
    driver_opts:
      size: 5Gi
