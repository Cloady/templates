services:
  valkey:
    image: valkey/valkey:9.1.2
    command: valkey-server --requirepass ${VALKEY_PASSWORD} --appendonly yes
    ports:
      - 6379
    volumes:
      - data:/data
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 128M
volumes:
  data:
    driver_opts:
      size: 1Gi
