services:
  mempool:
    image: mempool/frontend:v3.3.1
    command: nginx -g 'daemon off;'
    environment:
      FRONTEND_HTTP_PORT: "8080"
      BACKEND_MAINNET_HTTP_HOST: mempool-api
    ports:
      - 8080
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
  mempool-db:
    image: mariadb:10.11.19
    environment:
      MYSQL_USER: mempool
      MYSQL_DATABASE: mempool
      MYSQL_PASSWORD: ${MEMPOOL_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MEMPOOL_DB_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
  mempool-api:
    image: mempool/backend:v3.3.1
    command: ./start.sh
    environment:
      CORE_RPC_HOST: ${CORE_RPC_HOST}
      CORE_RPC_PORT: "8332"
      DATABASE_HOST: mempool-db
      ELECTRUM_HOST: ${ELECTRUM_HOST}
      ELECTRUM_PORT: ${ELECTRUM_PORT}
      CORE_RPC_COOKIE: "true"
      MEMPOOL_BACKEND: electrum
      CORE_RPC_TIMEOUT: "60000"
      DATABASE_ENABLED: "true"
      DATABASE_DATABASE: mempool
      DATABASE_PASSWORD: ${MEMPOOL_DB_PASSWORD}
      DATABASE_USERNAME: mempool
      STATISTICS_ENABLED: "true"
      CORE_RPC_COOKIE_PATH: /data/.bitcoin/.cookie
      ELECTRUM_TLS_ENABLED: "false"
    volumes:
      - data:/data/.bitcoin:ro
      - data:/backend/cache
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 256M
volumes:
  db:
    driver_opts:
      size: 2Gi
  data:
    driver_opts:
      size: 2Gi
