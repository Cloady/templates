services:
  virtualtabletop:
    image: arnoldsmith86/virtualtabletop@sha256:7ae2e871fc3193af2a1017ba5ad1b43679268b2e813e00427cdee81035fb74db
    environment:
      SERVERNAME: ${SERVER_NAME}
      EXTERNALURL: https://${PUBLIC_HOST}
    ports:
      - 8272
    volumes:
      - save:/app/save
    deploy:
      resources:
        reservations:
          cpus: 0.5
          memory: 512M
volumes:
  save:
    driver_opts:
      size: 2Gi
