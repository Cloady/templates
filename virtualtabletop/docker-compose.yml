services:
  virtualtabletop:
    image: arnoldsmith86/virtualtabletop@sha256:d8ffbe8238297641311bbb326aaed29f3ab87820c09dbde698ed5224480d733c
    environment:
      SERVERNAME: ${SERVER_NAME}
      EXTERNALURL: https://${PUBLIC_HOST}
    ports:
      - 8272
    volumes:
      - save:/app/save
    deploy:
      resources:
        reservations:
          cpus: 0.5
          memory: 512M
volumes:
  save:
    driver_opts:
      size: 2Gi
