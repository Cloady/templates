services:
  virtualtabletop:
    image: arnoldsmith86/virtualtabletop@sha256:4cd15ec6fa5db8cc0bac9855130770dc82aeafd7d82f436448b928fd9eb4977f
    environment:
      SERVERNAME: ${SERVER_NAME}
      EXTERNALURL: https://${PUBLIC_HOST}
    ports:
      - 8272
    volumes:
      - save:/app/save
    deploy:
      resources:
        reservations:
          cpus: 0.5
          memory: 512M
volumes:
  save:
    driver_opts:
      size: 2Gi
