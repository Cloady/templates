services:
  virtualtabletop:
    image: arnoldsmith86/virtualtabletop@sha256:c10513a4fc5c678cb4e41674bee5cbb19f8b7fa65dd855878b66b55e006268d8
    environment:
      SERVERNAME: ${SERVER_NAME}
      EXTERNALURL: https://${PUBLIC_HOST}
    ports:
      - 8272
    volumes:
      - save:/app/save
    deploy:
      resources:
        reservations:
          cpus: 0.5
          memory: 512M
volumes:
  save:
    driver_opts:
      size: 2Gi
