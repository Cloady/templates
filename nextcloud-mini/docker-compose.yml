services:
  nextcloud-mini:
    image: nextcloud:35.0.1
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_HOST: nextcloud-mini-db
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_MINI_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_MINI_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_MINI_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_MINI_TRUSTED_DOMAINS}
    ports:
      - 80
    volumes:
      - nextcloud:/var/www/html
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
  nextcloud-mini-db:
    image: postgres:16
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_MINI_DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
volumes:
  db:
    driver_opts:
      size: 2Gi
  nextcloud:
    driver_opts:
      size: 2Gi
