services:
  web:
    image: glitchtip/glitchtip:6.2.6
    environment:
      SERVER_ROLE: all_in_one
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      SECRET_KEY: ${SECRET_KEY}
      EMAIL_URL: ${EMAIL_URL}
      GLITCHTIP_DOMAIN: ${PUBLIC_URL}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      ENABLE_ADMIN: "False"
      ENABLE_OPENAPI: "False"
      GLITCHTIP_ENABLE_MCP: "False"
      GLITCHTIP_ENABLE_DUCKDB: "False"
    ports:
      - 8000
    volumes:
      - uploads:/code/uploads
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 512M
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - 5432
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        reservations:
          cpus: 0.15
          memory: 256M
  valkey:
    image: valkey/valkey:9.1.2
    command: valkey-server --requirepass ${VALKEY_PASSWORD}
    expose:
      - 6379
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 128M
volumes:
  pg-data:
    driver_opts:
      size: 2Gi
  uploads:
    driver_opts:
      size: 1Gi
