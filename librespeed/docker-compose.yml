services:
  librespeed:
    image: lscr.io/linuxserver/librespeed:6.3.0
    environment:
      TZ: ${TZ}
      PGID: "1000"
      PUID: "1000"
      PASSWORD: ${APP_PASSWORD}
    ports:
      - 80
    volumes:
      - data:/config
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  data:
    driver_opts:
      size: 2Gi
