services:
  freshrss:
    image: lscr.io/linuxserver/freshrss:1.30.0
    environment:
      TZ: ${TZ}
      PGID: "1000"
      PUID: "1000"
    ports:
      - 80
    volumes:
      - freshrss-config:/config
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
volumes:
  freshrss-config:
    driver_opts:
      size: 2Gi
